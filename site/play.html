<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>작품 · 과학 게임 갤러리</title>
<link rel="stylesheet" href="gallery.css">
</head>
<body class="play" data-page="play">
<div class="bar">
  <a class="back btn" id="back" href="./">← 목록</a>
  <div class="name"><span class="no" id="pno"></span><span class="ttl" id="ptitle"></span></div>
  <a class="btn" id="prev" aria-label="이전 작품">이전 작품</a>
  <a class="btn" id="next" aria-label="다음 작품">다음 작품</a>
  <button class="btn" id="reload" type="button">처음부터 다시</button>
  <button class="btn" id="full" type="button">전체 화면</button>
</div>
<div class="stage" id="stage"></div>
<div class="note">불편하거나 이상한 작품이면 선생님께 알려 주세요.</div>
<script src="gallery.js"></script>
</body>
</html>
